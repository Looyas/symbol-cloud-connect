name: release

# A release is created only from a protected tag oci-vX.Y.Z. Releases are immutable:
# the job fails if the release already exists, and a published zip is never replaced
# (connections-service pins each version's SHA-256 and re-checks it daily).
on:
  push:
    tags: ["oci-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: validate
        working-directory: oci
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; releases are immutable." >&2
            exit 1
          fi

      - name: package
        run: bash scripts/package.sh "$GITHUB_REF_NAME"

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_REF_NAME#oci-}"
          zip="dist/symbol-oci-stack-${short}.zip"
          sha="$(cut -d' ' -f1 "${zip}.sha256")"
          notes="$(awk -v v="$GITHUB_REF_NAME" '$0 ~ "^## "v {f=1; next} f && /^## /{exit} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" "${zip}" "${zip}.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(printf '%s\n\nSHA-256 (symbol-oci-stack-%s.zip): `%s`\n' "$notes" "$short" "$sha")" \
            --verify-tag
