name: azure-release

# A release is created only from a protected tag azure-vX.Y.Z. Releases are immutable:
# the job fails if the release already exists.
#
# NOTHING IS PUBLISHED TO A BUCKET, unlike aws-release. Azure's launch is a Cloud Shell
# command that CLONES this repository at the tag, and connections-service pins the
# COMMIT that tag points at -- a tag can be moved, a commit cannot. So the release's job
# is to validate the folder, cut the tag, and print the commit an operator copies into
# SETUP_TEMPLATE_REGISTRY. Same shape as the GCP release.
on:
  push:
    tags: ["azure-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # The minimum symbol-setup.sh accepts: a release must plan on it.
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: validate
        working-directory: azure
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: the tag matches the template version the folder declares
        # symbol-setup.sh is run with --template <tag>, and the code it prints echoes it.
        # A tag that does not match its CHANGELOG entry would publish a release whose
        # codes Symbol then refuses as `unknown_template`.
        run: |
          if ! grep -q "^## \[${GITHUB_REF_NAME}\]" azure/CHANGELOG.md; then
            echo "azure/CHANGELOG.md has no '## [${GITHUB_REF_NAME}]' entry." >&2
            exit 1
          fi

      - name: cross-checks
        working-directory: azure
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pytest==8.3.5"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests

      - name: refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; releases are immutable." >&2
            exit 1
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse HEAD^{commit})"
          notes="$(awk -v v="$GITHUB_REF_NAME" '$0 ~ "^## \\["v"\\]" {f=1; next} f && /^## /{exit} f' azure/CHANGELOG.md)"
          registry="$(printf '{"azure":{"current":"%s","versions":{"%s":{"repo":"%s","git_tag":"%s","commit":"%s","source_url":"%s/tree/%s/azure"}}}}' \
            "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$GITHUB_REF_NAME" "$commit" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(printf '%s\n\n## SETUP_TEMPLATE_REGISTRY entry\n\nCommit: `%s`\n\n```json\n%s\n```\n' \
              "$notes" "$commit" "$registry")" \
            --verify-tag
